[buildout]
extensions =
    mr.developer

show-picked-versions = true
allow-picked-versions = false

parts =
    omelette
    instance1
    zopepy
    repozo

extends =
    https://dist.plone.org/release/6.2.2/versions.cfg
    https://dist.plone.org/release/6.2.2/versions-extra.cfg
    https://dist.plone.org/release/6.2.2/versions-ecosystem.cfg
    versions-base.cfg

versions = versions

find-links =

eggs =
    Plone
    Pillow
    imio.dms.policy

develop =

always-checkout = force

[omelette]
recipe = collective.recipe.omelette
eggs = ${instance1:eggs}

[instance1]
recipe = plone.recipe.zope2instance
user = admin:${port:admin-password}
http-address = ${port:instance1-http}
zserver-threads = 4
debug-mode = off
verbose-security = off
zodb-temporary-storage = off
# LibreOffice conversions (collective.documentgenerator / appy) run appy's convert.py with the UNO python
# (PYTHON_UNO): it must find appy and its imports (pure Python fallbacks of persistent and zope.interface)
initialization =
    import os
    os.environ['PYTHONPATH'] = os.pathsep.join(p for p in sys.path if any(n in p for n in ('/appy-', '/persistent-', '/zope.interface-')))
zope-conf-additional =
  locale ${port:locale}
  <product-config imio.dms.mail>
    plone-path ${port:plone-path}
  </product-config>
  <product-config imio.fpaudit>
    plone-path ${port:plone-path}
  </product-config>
  # scan ids (was imio.zamqp.core / collective.zamqp, no AMQP intake on Plone 6)
  <product-config imio.zamqp.core>
    client_id ${port:client-id}
  </product-config>
  # sessions (collective.beaker replaces Zope sessions)
  <product-config beaker>
    session.type file
    session.data_dir ${buildout:directory}/var/sessions/data
    session.lock_dir ${buildout:directory}/var/sessions/lock
    session.key beaker.session
    session.secret ${port:beaker-secret}
  </product-config>
environment-vars =
  PYTHON_EGG_CACHE ${buildout:directory}/python-eggs
  zope_i18n_compile_mo_files true
  OO_PORT ${port:oo-port}
  PYTHON_UNO ${port:python-uno}
  PUBLIC_URL ${port:public-url}
  decorate_acl_methods true

eggs =
  ${buildout:eggs}
# the policy ZCML includes every iA.Docs package
zcml =
  imio.dms.policy

[upgrade]
recipe = zc.recipe.egg
eggs =
    ${instance1:eggs}
    collective.upgrade
scripts = upgrade-portals
arguments = args=[
    '--zope-conf', '${instance1:location}/etc/zope.conf',
    '--log-file', '${buildout:directory}/var/log/upgrade.log']

[zopepy]
recipe = zc.recipe.egg
eggs = ${instance1:eggs}
interpreter = zopepy
scripts = zopepy

[repozo]
recipe = zc.recipe.egg
eggs = ZODB
scripts = repozo

[remotes]
plone = https://github.com/plone
plone_push = git@github.com:plone
collective = https://github.com/collective
collective_push = git@github.com:collective
imio = https://github.com/IMIO
imio_push = git@github.com:IMIO
sge = https://github.com/sgeulette
sge_push = git@github.com:sgeulette

# defaults of the Plone 6 values, port.cfg (generated in production) can override them
[port]
locale = fr_BE.UTF-8
client-id = 019999
beaker-secret = secret
