[buildout]

extensions +=
    plone.versioncheck

parts +=
    test
    testme
    ploneversioncheck

# create bin/test command
[test]
recipe = zc.recipe.testrunner
defaults = ['--auto-color', '--auto-progress']
eggs =
    ${instance1:eggs}
    collective.MockMailHost
    imio.dms.mail [test]
    imio.dms.policy [test]
environment = testenv
initialization =
    import os
    from datetime import datetime
    print("TESTS RUN ON: {}".format(datetime.strftime(datetime.now(), '%Y-%m-%d %H:%M')))
    os.environ['PYTHONPATH'] = os.pathsep.join(p for p in sys.path if any(n in p for n in ('/appy-', '/persistent-', '/zope.interface-')))

[testme]
<= test
initialization +=
    sys.argv = sys.argv[:] + ['-s', 'imio.dms.mail']

[testenv]
zope_i18n_compile_mo_files = true
OO_PORT = ${port:oo-port}
PYTHON_UNO = ${port:python-uno}
PUBLIC_URL = ${port:public-url}
decorate_acl_methods = true
ENV = DEV

[ploneversioncheck]
recipe = zc.recipe.egg
eggs = plone.versioncheck
