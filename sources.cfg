# Plone 6.2 branches of the iA.Docs packages (migration PRs and fix branches, not released yet),
# as imio.dms.policy (branch plone6, checkouts.cfg); the releases are pinned in versions-base.cfg
[buildout]
auto-checkout +=
    collective.beaker
    collective.classification.folder
    collective.classification.tree
    collective.compoundcriterion
    collective.contact.contactlist
    collective.contact.core
    collective.contact.duplicated
    collective.contact.facetednav
    collective.contact.importexport
    collective.contact.plonegroup
    collective.contact.widget
    collective.dms.basecontent
    collective.dms.batchimport
    collective.dms.mailcontent
    collective.dms.scanbehavior
    collective.documentgenerator
    collective.eeafaceted.batchactions
    collective.eeafaceted.collectionwidget
    collective.eeafaceted.dashboard
    collective.eeafaceted.z3ctable
    collective.elephantvocabulary
    collective.externaleditor
    collective.iconifiedcategory
    collective.js.datatables
    collective.js.fancytree
    collective.js.jqueryui
    collective.js.tooltipster
    collective.querynextprev
    collective.task
    collective.upgrade
    communesplone.layout
    dexterity.localroles
    eea.facetednavigation
    imio.actionspanel
    imio.annex
    imio.dashboard
    imio.dms.mail
    imio.dms.policy
    imio.helpers
    imio.history
    imio.migrator
    imio.pm.locales
    imio.pm.wsclient
    imio.prettylink
    imio.transmogrifier.contact
    imio.transmogrifier.iadocs
    plone.formwidget.contenttree
    plone.formwidget.masterselect
    plonetheme.imioapps
    Products.CPUtils
    Products.PasswordStrength

[sources]
Products.CPUtils = git ${remotes:imio}/Products.CPUtils.git pushurl=${remotes:imio_push}/Products.CPUtils.git branch=python3-chris-adam
# 0.5.0 (PyPI) validates the password of the Plone 6 login form (PR collective/Products.PasswordStrength#15)
Products.PasswordStrength = git ${remotes:collective}/Products.PasswordStrength.git pushurl=${remotes:collective_push}/Products.PasswordStrength.git branch=plone6-login-fix
# 1.0b3 (PyPI) reads Session._path, gone in Beaker 1.14 (collective.querynextprev sessions)
collective.beaker = git ${remotes:collective}/collective.beaker.git pushurl=${remotes:collective_push}/collective.beaker.git branch=plone6.1
collective.classification.folder = git ${remotes:imio}/collective.classification.folder.git pushurl=${remotes:imio_push}/collective.classification.folder.git branch=plone6-chris-adam
collective.classification.tree = git ${remotes:imio}/collective.classification.tree.git pushurl=${remotes:imio_push}/collective.classification.tree.git branch=plone6-chris-adam
collective.compoundcriterion = git ${remotes:collective}/collective.compoundcriterion.git pushurl=${remotes:collective_push}/collective.compoundcriterion.git branch=plone6-chris-adam
collective.contact.contactlist = git ${remotes:collective}/collective.contact.contactlist.git pushurl=${remotes:collective_push}/collective.contact.contactlist.git branch=plone6-chris-adam
collective.contact.core = git ${remotes:collective}/collective.contact.core.git pushurl=${remotes:collective_push}/collective.contact.core.git branch=python3-chris-adam
collective.contact.duplicated = git ${remotes:collective}/collective.contact.duplicated.git pushurl=${remotes:collective_push}/collective.contact.duplicated.git branch=plone6-chris-adam
collective.contact.facetednav = git ${remotes:collective}/collective.contact.facetednav.git pushurl=${remotes:collective_push}/collective.contact.facetednav.git branch=plone6-chris-adam
collective.contact.importexport = git ${remotes:imio}/collective.contact.importexport.git pushurl=${remotes:imio_push}/collective.contact.importexport.git branch=plone61-chris-adam
collective.contact.plonegroup = git ${remotes:collective}/collective.contact.plonegroup.git pushurl=${remotes:collective_push}/collective.contact.plonegroup.git branch=python3-chris-adam
# python3 merged: master is the Plone 6 code
collective.contact.widget = git ${remotes:collective}/collective.contact.widget.git pushurl=${remotes:collective_push}/collective.contact.widget.git branch=master
collective.dms.basecontent = git ${remotes:collective}/collective.dms.basecontent.git pushurl=${remotes:collective_push}/collective.dms.basecontent.git branch=Plone61-chris-adam
collective.dms.batchimport = git ${remotes:collective}/collective.dms.batchimport.git pushurl=${remotes:collective_push}/collective.dms.batchimport.git branch=plone6-chris-adam
collective.dms.mailcontent = git ${remotes:collective}/collective.dms.mailcontent.git pushurl=${remotes:collective_push}/collective.dms.mailcontent.git branch=plone6-chris-adam
collective.dms.scanbehavior = git ${remotes:collective}/collective.dms.scanbehavior.git pushurl=${remotes:collective_push}/collective.dms.scanbehavior.git branch=python3-chris-adam
# 4.0 (PyPI): generated file names start with "b" on Python 3 (PR collective/collective.documentgenerator#89)
collective.documentgenerator = git ${remotes:collective}/collective.documentgenerator.git pushurl=${remotes:collective_push}/collective.documentgenerator.git branch=plone6-filename-str
collective.eeafaceted.batchactions = git ${remotes:imio}/collective.eeafaceted.batchactions.git pushurl=${remotes:imio_push}/collective.eeafaceted.batchactions.git branch=python3-chris-adam
# 0.2.5 (PyPI) imports zope.interface.implements (collective.contact.plonegroup uses this branch)
collective.elephantvocabulary = git ${remotes:collective}/collective.elephantvocabulary.git pushurl=${remotes:collective_push}/collective.elephantvocabulary.git branch=plone5_py3
collective.eeafaceted.collectionwidget = git ${remotes:collective}/collective.eeafaceted.collectionwidget.git pushurl=${remotes:collective_push}/collective.eeafaceted.collectionwidget.git branch=python3-chris-adam
collective.eeafaceted.dashboard = git ${remotes:collective}/collective.eeafaceted.dashboard.git pushurl=${remotes:collective_push}/collective.eeafaceted.dashboard.git branch=python3-chris-adam
collective.eeafaceted.z3ctable = git ${remotes:imio}/collective.eeafaceted.z3ctable.git pushurl=${remotes:imio_push}/collective.eeafaceted.z3ctable.git branch=plone6_duchenean-chris-adam
collective.externaleditor = git ${remotes:collective}/collective.externaleditor.git pushurl=${remotes:collective_push}/collective.externaleditor.git branch=plone6-extedit-condition
collective.iconifiedcategory = git ${remotes:imio}/collective.iconifiedcategory.git pushurl=${remotes:imio_push}/collective.iconifiedcategory.git branch=python3-chris-adam
collective.js.datatables = git ${remotes:collective}/collective.js.datatables.git pushurl=${remotes:collective_push}/collective.js.datatables.git branch=master
collective.js.fancytree = git ${remotes:collective}/collective.js.fancytree.git pushurl=${remotes:collective_push}/collective.js.fancytree.git branch=plone6.1
# 2.2.0 never loads jQuery UI (resource ids), fixed in collective/collective.js.jqueryui#58
collective.js.jqueryui = git ${remotes:collective}/collective.js.jqueryui.git pushurl=${remotes:collective_push}/collective.js.jqueryui.git branch=plone62-bundle-fix
collective.js.tooltipster = git ${remotes:collective}/collective.js.tooltipster.git pushurl=${remotes:collective_push}/collective.js.tooltipster.git branch=plone61-chris-adam
collective.querynextprev = git ${remotes:collective}/collective.querynextprev.git pushurl=${remotes:collective_push}/collective.querynextprev.git branch=python3-chris-adam
collective.task = git ${remotes:collective}/collective.task.git pushurl=${remotes:collective_push}/collective.task.git branch=plone6-chris-adam
communesplone.layout = git ${remotes:imio}/communesplone.layout.git pushurl=${remotes:imio_push}/communesplone.layout.git branch=python3-chris-adam
# 2.0.0b2 (PyPI): fti_configuration writes on read, plone.protect @@confirm-action (PR collective/dexterity.localroles#6)
dexterity.localroles = git ${remotes:collective}/dexterity.localroles.git pushurl=${remotes:collective_push}/dexterity.localroles.git branch=plone6-no-write-on-read
# develop-chris-adam: faceted bundles no longer load_async (16.4 bug), not released yet
eea.facetednavigation = git https://github.com/chris-adam/eea.facetednavigation.git pushurl=git@github.com:chris-adam/eea.facetednavigation.git branch=develop-chris-adam
imio.actionspanel = git ${remotes:imio}/imio.actionspanel.git pushurl=${remotes:imio_push}/imio.actionspanel.git branch=plone6-chris-adam
imio.annex = git ${remotes:imio}/imio.annex.git pushurl=${remotes:imio_push}/imio.annex.git branch=plone6
imio.dashboard = git ${remotes:imio}/imio.dashboard.git pushurl=${remotes:imio_push}/imio.dashboard.git branch=python3-chris-adam
# 1.3.18 (PyPI): RFC 2047 encoded address headers and bcc in To on Python 3 (PR IMIO/imio.helpers#51)
# draft PR IMIO/imio.dms.mail#158
imio.dms.mail = git ${remotes:imio}/imio.dms.mail.git pushurl=${remotes:imio_push}/imio.dms.mail.git branch=plone6
imio.helpers = git ${remotes:imio}/imio.helpers.git pushurl=${remotes:imio_push}/imio.helpers.git branch=py3-email-address-headers
imio.history = git ${remotes:imio}/imio.history.git pushurl=${remotes:imio_push}/imio.history.git branch=plone6-chris-adam
imio.migrator = git ${remotes:imio}/imio.migrator.git pushurl=${remotes:imio_push}/imio.migrator.git branch=plone6.1-chris-adam
imio.pm.locales = git ${remotes:imio}/imio.pm.locales.git pushurl=${remotes:imio_push}/imio.pm.locales.git branch=plone6
imio.pm.wsclient = git ${remotes:imio}/imio.pm.wsclient.git pushurl=${remotes:imio_push}/imio.pm.wsclient.git branch=python3-chris-adam
imio.prettylink = git ${remotes:imio}/imio.prettylink.git pushurl=${remotes:imio_push}/imio.prettylink.git branch=plone6-icon-names
# draft PR IMIO/imio.transmogrifier.contact#1
imio.transmogrifier.contact = git ${remotes:imio}/imio.transmogrifier.contact.git pushurl=${remotes:imio_push}/imio.transmogrifier.contact.git branch=plone6
# draft PR IMIO/imio.transmogrifier.iadocs#2
imio.transmogrifier.iadocs = git ${remotes:imio}/imio.transmogrifier.iadocs.git pushurl=${remotes:imio_push}/imio.transmogrifier.iadocs.git branch=plone6-chris-adam
# 1.2.0 (PyPI) navtree uses portal_properties (collective.contact.widget sources): python3 branch, as contact.widget's buildout
plone.formwidget.contenttree = git ${remotes:plone}/plone.formwidget.contenttree.git pushurl=${remotes:plone_push}/plone.formwidget.contenttree.git branch=python3
# PyPI 3.0.0 is Plone 5.2 only (z3c.autoinclude <includeDependencies>): master has the Plone 6 code, unreleased
plone.formwidget.masterselect = git ${remotes:collective}/plone.formwidget.masterselect.git pushurl=${remotes:collective_push}/plone.formwidget.masterselect.git branch=master
plonetheme.imioapps = git ${remotes:imio}/plonetheme.imioapps.git pushurl=${remotes:imio_push}/plonetheme.imioapps.git branch=python3-chris-adam
# draft PR IMIO/imio.dms.policy#2
imio.dms.policy = git ${remotes:imio}/imio.dms.policy.git pushurl=${remotes:imio_push}/imio.dms.policy.git branch=plone6
# draft PR collective/collective.upgrade#19
collective.upgrade = git ${remotes:collective}/collective.upgrade.git pushurl=${remotes:collective_push}/collective.upgrade.git branch=plone61-chris-adam
